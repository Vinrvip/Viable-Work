<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Viable Works - Module 09</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; user-select: none; }
    body { background-color: #050508; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .crt::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); pointer-events: none; z-index: 100; }
    #game-wrapper { width: 450px; background: #080812; border: 4px solid #1a1a3a; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; align-items: center; z-index: 10; }
    
    .hud { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #00d2ff; padding-bottom: 10px; }
    .back-btn { background: transparent; color: #ff0055; border: 2px solid #ff0055; padding: 8px 12px; font-size: 0.7rem; cursor: pointer; text-decoration: none; transition: 0.2s; }
    .back-btn:hover { background: #ff0055; color: #000; box-shadow: 0 0 10px #ff0055; }
    
    .score-board { text-align: right; }
    #score { color:#00d2ff; font-size:0.8rem; margin-bottom: 5px; }
    #high-score { color:#8888aa; font-size:0.6rem; }
    
    #game-area { position: relative; }
    canvas { border: 2px solid #333355; background: #050508; display: block; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; border: 2px solid #333355; }
    .action-btn { background: #111122; color: #00d2ff; border: 2px solid #00d2ff; padding: 15px 20px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
    .action-btn:hover { background: #00d2ff; color: #000; box-shadow: 0 0 15px #00d2ff; }
    #overlay-msg { color: #ff0055; font-size: 0.8rem; margin-bottom: 20px; display: none; text-align:center; line-height: 1.5; }
  </style>
</head>
<body class="crt">
  <div id="game-wrapper">
    <div class="hud">
      <a href="index.html" class="back-btn">◄ SYS.DIRECTORY</a>
      <div class="score-board">
        <div id="score">CYCLES: 000</div>
        <div id="high-score">HIGH: 000</div>
      </div>
    </div>
    <div id="game-area">
      <canvas id="canvas" width="400" height="400"></canvas>
      <div id="overlay">
        <div id="overlay-msg">CORRUPTION DETECTED</div>
        <button class="action-btn" onclick="startGame()">INITIATE EVASION</button>
      </div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    
    let player = { x: 190, y: 360, w: 20, h: 20, speed: 6 };
    let blocks = [];
    let score = 0;
    let highScore = 0;
    let gameActive = false;
    let animationId;
    
    const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };

    // Ensure the iframe has focus so arrow keys work in CodeHS
    window.addEventListener('click', function() { window.focus(); });

    document.addEventListener('keydown', function(e) { 
      if(keys.hasOwnProperty(e.key)) keys[e.key] = true; 
    });
    document.addEventListener('keyup', function(e) { 
      if(keys.hasOwnProperty(e.key)) keys[e.key] = false; 
    });

    function formatScore(num) {
      if (num < 10) return "00" + num;
      if (num < 100) return "0" + num;
      return num.toString();
    }

    function startGame() {
      overlay.style.display = 'none'; 
      blocks = []; 
      score = 0; 
      player.x = 190;
      gameActive = true;
      
      if(animationId) cancelAnimationFrame(animationId);
      update();
    }

    function update() {
      if(!gameActive) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      score++; 
      document.getElementById('score').innerText = "CYCLES: " + formatScore(score);

      if (keys.ArrowLeft || keys.a) player.x -= player.speed;
      if (keys.ArrowRight || keys.d) player.x += player.speed;

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

      let speedBoost = Math.min(score / 400, 7); 
      let spawnChance = 0.06 + Math.min(score / 8000, 0.08); 

      if(Math.random() < spawnChance) {
        let blockWidth = 20 + Math.random() * 40;
        let blockHeight = 15 + Math.random() * 25;
        let spawnX = Math.random() * (canvas.width - blockWidth);
        
        blocks.push({ x: spawnX, y: -40, w: blockWidth, h: blockHeight });
      }

      ctx.fillStyle = '#00d2ff'; 
      ctx.fillRect(player.x, player.y, player.w, player.h);

      ctx.fillStyle = '#ff0055';
      for(let i = 0; i < blocks.length; i++) {
        let b = blocks[i]; 
        
        b.y += 4 + speedBoost; 
        ctx.fillRect(b.x, b.y, b.w, b.h);

        if(
          player.x < b.x + b.w && 
          player.x + player.w > b.x && 
          player.y < b.y + b.h && 
          player.y + player.h > b.y
        ) {
          triggerGameOver();
        }
      }

      blocks = blocks.filter(function(b) { return b.y < canvas.height + 20; });

      if(gameActive) {
        animationId = requestAnimationFrame(update);
      }
    }

    function triggerGameOver() {
      gameActive = false;
      
      if (score > highScore) {
        highScore = score;
        document.getElementById('high-score').innerText = "HIGH: " + formatScore(highScore);
        document.getElementById('high-score').style.color = "#00d2ff";
      }

      document.getElementById('overlay-msg').style.display = 'block';
      document.querySelector('.action-btn').innerText = "REBOOT SEQUENCE";
      overlay.style.display = 'flex';
    }
  </script>
</body>
</html>
