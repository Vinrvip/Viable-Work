<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Viable Works - Module 06</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; user-select: none; }
    body { background-color: #050508; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .crt::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 100; pointer-events: none; }
    #game-wrapper { width: 450px; background: #080812; border: 4px solid #1a1a3a; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); border-radius: 8px; padding: 20px; z-index: 10; display: flex; flex-direction: column; align-items: center; }
    .hud { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #00d2ff; padding-bottom: 10px; }
    .back-btn { background: transparent; color: #ff0055; border: 2px solid #ff0055; padding: 8px 12px; font-size: 0.7rem; cursor: pointer; text-decoration: none; }
    
    #game-area { position: relative; width: 400px; height: 400px; }
    #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; height: 100%; background: #333355; border: 2px solid #111122; padding: 10px; }
    .cell { background: #111122; color: #00d2ff; display: flex; align-items: center; justify-content: center; font-size: 4rem; cursor: pointer; transition: 0.2s; }
    .cell.x { color: #00d2ff; }
    .cell.o { color: #ff0055; }
    
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; border: 2px solid #333355; }
    .action-btn { background: #111122; color: #00d2ff; border: 2px solid #00d2ff; padding: 15px 20px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
    .action-btn:hover { background: #00d2ff; color: #000; box-shadow: 0 0 15px #00d2ff; }
    #overlay-msg { color: #ff0055; font-size: 0.8rem; margin-bottom: 20px; text-align: center; line-height: 1.5; display: none; }
    .instructions { margin-top: 15px; font-size: 0.65rem; color: #8888aa; text-align: center; line-height: 1.4; }
  </style>
</head>
<body class="crt">
  <div id="game-wrapper">
    <div class="hud">
      <a href="index.html" class="back-btn">◄ SYS.DIRECTORY</a>
      <div style="color:#00d2ff; font-size:0.8rem;">OPPONENT: AI MAX</div>
    </div>
    
    <div id="game-area">
      <div id="board"></div>
      <div id="overlay">
        <div id="overlay-msg">DEFEAT</div>
        <button class="action-btn" id="action-btn" onclick="startGame()">INITIATE SEQUENCE</button>
      </div>
    </div>
    <div class="instructions" id="status">MODULE 06: TIC-TAC-TOE<br>Outsmart the AI. Ties trigger auto-restart.</div>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    let board = [], human = 'X', ai = 'O', gameActive = false;

    function startGame() {
      overlay.style.display = 'none';
      board = ['', '', '', '', '', '', '', '', ''];
      gameActive = true;
      render();
    }

    function render() {
      boardEl.innerHTML = '';
      board.forEach((val, i) => {
        let cell = document.createElement('div');
        cell.className = `cell ${val.toLowerCase()}`;
        cell.innerText = val;
        cell.onclick = () => playerMove(i);
        boardEl.appendChild(cell);
      });
    }

    function playerMove(i) {
      if(board[i] === '' && gameActive) {
        board[i] = human;
        render();
        if(!checkGameEnd(human)) {
          gameActive = false;
          setTimeout(aiMove, 300);
        }
      }
    }

    function aiMove() {
      let bestScore = -Infinity;
      let move;
      for(let i = 0; i < 9; i++) {
        if(board[i] === '') {
          board[i] = ai;
          let score = minimax(board, 0, false);
          board[i] = '';
          if(score > bestScore) { bestScore = score; move = i; }
        }
      }
      board[move] = ai;
      render();
      if(!checkGameEnd(ai)) gameActive = true;
    }

    let scores = { X: -10, O: 10, tie: 0 };

    function minimax(boardState, depth, isMaximizing) {
      let result = checkWinner(boardState);
      if(result !== null) return scores[result];

      if(isMaximizing) {
        let bestScore = -Infinity;
        for(let i = 0; i < 9; i++) {
          if(boardState[i] === '') {
            boardState[i] = ai;
            let score = minimax(boardState, depth + 1, false);
            boardState[i] = '';
            bestScore = Math.max(score, bestScore);
          }
        }
        return bestScore;
      } else {
        let bestScore = Infinity;
        for(let i = 0; i < 9; i++) {
          if(boardState[i] === '') {
            boardState[i] = human;
            let score = minimax(boardState, depth + 1, true);
            boardState[i] = '';
            bestScore = Math.min(score, bestScore);
          }
        }
        return bestScore;
      }
    }

    function checkWinner(b) {
      const winStates = [ [0,1,2],[3,4,5],[6,7,8], [0,3,6],[1,4,7],[2,5,8], [0,4,8],[2,4,6] ];
      for(let i=0; i<winStates.length; i++) {
        const [x,y,z] = winStates[i];
        if(b[x] && b[x] === b[y] && b[x] === b[z]) return b[x];
      }
      if(b.filter(s => s === '').length === 0) return 'tie';
      return null;
    }

    function checkGameEnd(player) {
      let winner = checkWinner(board);
      if(winner === 'tie') {
        // AUTO RESTART ON TIE
        document.getElementById('status').style.color = '#ffff00';
        document.getElementById('status').innerText = "STALEMATE DETECTED. RECALCULATING...";
        setTimeout(() => {
          document.getElementById('status').style.color = '#8888aa';
          document.getElementById('status').innerHTML = "MODULE 06: TIC-TAC-TOE<br>Outsmart the AI. Ties trigger auto-restart.";
          startGame();
        }, 1000);
        return true;
      } else if (winner !== null) {
        gameActive = false;
        overlayMsg.style.color = winner === human ? '#00d2ff' : '#ff0055';
        overlayMsg.innerText = winner === human ? "SYSTEM OVERRIDDEN (WIN)" : "SYSTEM SECURED (DEFEAT)";
        overlayMsg.style.display = 'block';
        document.getElementById('action-btn').innerText = "REBOOT MODULE";
        overlay.style.display = 'flex';
        return true;
      }
      return false;
    }
    render();
  </script>
</body>
</html>
