<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viable Works - Module 02</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; user-select: none; }
    body { background-color: #050508; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .crt::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 100; background-size: 100% 3px, 6px 100%; pointer-events: none; }
    
    #game-wrapper { width: 450px; max-width: 95vw; background: #080812; border: 4px solid #1a1a3a; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); border-radius: 8px; padding: 20px; z-index: 10; display: flex; flex-direction: column; align-items: center; }
    .hud { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #00d2ff; padding-bottom: 10px; }
    .back-btn { background: transparent; color: #ff0055; border: 2px solid #ff0055; padding: 8px 12px; font-size: 0.7rem; cursor: pointer; text-decoration: none; }
    .back-btn:hover { background: #ff0055; color: #000; }
    .score { color: #00d2ff; font-size: 0.8rem; }
    canvas { border: 2px solid #333355; background: #050508; box-shadow: inset 0 0 10px #000; }
    .instructions { margin-top: 15px; font-size: 0.65rem; color: #8888aa; text-align: center; line-height: 1.4; }
  </style>
</head>
<body class="crt">
  <div id="game-wrapper">
    <div class="hud">
      <a href="index.html" class="back-btn">◄ SYS.DIRECTORY</a>
      <div class="score" id="score-display">SCORE: 000</div>
    </div>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="instructions" id="status-text">MODULE 02: SNAKE<br>Arrow keys to navigate. Avoid wall collisions.</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const statusText = document.getElementById('status-text');
    
    let grid = 20, score = 0, speed = 100, loopId;
    let snake = [{x: 10, y: 10}], velocity = {x: 1, y: 0}, nextVelocity = {x: 1, y: 0};
    let food = {x: 15, y: 10};

    function init() {
      document.addEventListener('keydown', handleInput);
      loopId = setInterval(gameLoop, speed);
    }

    function handleInput(e) {
      if (e.key === 'ArrowUp' && velocity.y === 0) nextVelocity = {x: 0, y: -1};
      if (e.key === 'ArrowDown' && velocity.y === 0) nextVelocity = {x: 0, y: 1};
      if (e.key === 'ArrowLeft' && velocity.x === 0) nextVelocity = {x: -1, y: 0};
      if (e.key === 'ArrowRight' && velocity.x === 0) nextVelocity = {x: 1, y: 0};
    }

    function gameLoop() {
      velocity = nextVelocity;
      let head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

      if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
        clearInterval(loopId);
        statusText.style.color = '#ff0055';
        statusText.innerHTML = "CRITICAL FAILURE.<br>Refresh module to restart.";
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreDisplay.innerText = `SCORE: ${score.toString().padStart(3, '0')}`;
        food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff0055'; 
      ctx.fillRect(food.x*grid + 2, food.y*grid + 2, grid-4, grid-4);
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#ffffff' : '#00d2ff';
        ctx.fillRect(s.x*grid + 1, s.y*grid + 1, grid-2, grid-2);
      });
    }

    init();
  </script>
</body>
</html>
