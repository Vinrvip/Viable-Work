<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DATA COMPRESSION - Merge Engine</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; }
    body { background: #050508; color: #00d2ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
    #game-card { background: #080812; border: 3px solid #1a1a3a; padding: 20px; border-radius: 8px; width: 100%; max-width: 440px; box-shadow: 0 0 25px rgba(0, 210, 255, 0.2); }
    h1 { color: #ff0055; font-size: 1.1rem; margin-bottom: 12px; text-shadow: 2px 2px 0 #00d2ff; text-align: center; }
    .hud { display: flex; justify-content: space-between; font-size: 0.65rem; color: #8888aa; margin-bottom: 15px; }
    #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #030306; padding: 10px; border: 2px solid #1a1a3a; border-radius: 6px; }
    .cell { width: 80px; height: 80px; background: #111122; border: 1px solid #1a1a3a; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; border-radius: 4px; transition: all 0.1s ease; }
    .v-2 { background: #112233; color: #00d2ff; }
    .v-4 { background: #113344; color: #00ff88; }
    .v-8 { background: #332244; color: #ff00ff; }
    .v-16 { background: #441133; color: #ff0055; }
    .v-32 { background: #552211; color: #ffaa00; }
    .v-64 { background: #664400; color: #ffff00; }
    .v-128 { background: #005544; color: #00ffff; box-shadow: 0 0 10px #00ffff; }
    .v-256 { background: #550055; color: #ff77ff; box-shadow: 0 0 12px #ff77ff; }
    .v-512+ { background: #ff0055; color: #ffffff; box-shadow: 0 0 15px #ff0055; }
    .controls-hint { margin-top: 15px; font-size: 0.55rem; color: #444466; text-align: center; }
    .back-btn { text-decoration: none; color: #8888aa; font-size: 0.6rem; display: block; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div id="game-card">
    <h1>DATA COMPRESSION</h1>
    <div class="hud">
      <span>BUFFER: <span id="score">0</span> KB</span>
      <span>STATUS: <span id="status" style="color:#00ff88;">ACTIVE</span></span>
    </div>
    <div id="grid"></div>
    <div class="controls-hint">[ARROW KEYS] SHIFT & MERGE DATA BLOCKS</div>
    <a href="index.html" class="back-btn">&lt; RETURN TO TERMINAL</a>
  </div>

  <script>
    let grid = Array(16).fill(0);
    let score = 0;

    function spawnTile() {
      const emptyCells = grid.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
      if (emptyCells.length === 0) return;
      const idx = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      grid[idx] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      const container = document.getElementById('grid');
      container.innerHTML = '';
      grid.forEach(val => {
        const cell = document.createElement('div');
        cell.className = `cell ${val > 0 ? (val <= 256 ? 'v-' + val : 'v-512+') : ''}`;
        cell.textContent = val > 0 ? val + 'K' : '';
        container.appendChild(cell);
      });
      document.getElementById('score').textContent = score;
    }

    function slide(row) {
      let arr = row.filter(val => val);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(val => val);
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function move(dir) {
      let prev = [...grid];
      for (let i = 0; i < 4; i++) {
        let row = [];
        for (let j = 0; j < 4; j++) {
          let idx = dir === 'left' || dir === 'right' ? i * 4 + j : j * 4 + i;
          row.push(grid[idx]);
        }
        if (dir === 'right' || dir === 'down') row.reverse();
        row = slide(row);
        if (dir === 'right' || dir === 'down') row.reverse();

        for (let j = 0; j < 4; j++) {
          let idx = dir === 'left' || dir === 'right' ? i * 4 + j : j * 4 + i;
          grid[idx] = row[j];
        }
      }

      if (JSON.stringify(prev) !== JSON.stringify(grid)) {
        spawnTile();
        render();
        checkGameOver();
      }
    }

    function checkGameOver() {
      if (grid.includes(0)) return;
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          let idx = i * 4 + j;
          if (j < 3 && grid[idx] === grid[idx + 1]) return;
          if (i < 3 && grid[idx] === grid[idx + 4]) return;
        }
      }
      document.getElementById('status').textContent = 'OVERFLOW';
      document.getElementById('status').style.color = '#ff0055';
    }

    window.addEventListener('keydown', e => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowRight') move('right');
      if (e.key === 'ArrowUp') move('up');
      if (e.key === 'ArrowDown') move('down');
    });

    spawnTile();
    spawnTile();
    render();
  </script>
</body>
</html>
