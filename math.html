<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viable Works - DECRYPT</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; user-select: none; }
    html { scrollbar-width: thin; scrollbar-color: #1a1a3a #050508; }
    body { background-color: #050508; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 0; overflow-x: hidden; position: relative; }

    /* Animated background grid */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
      background-size: 42px 42px;
      animation: gridDrift 14s linear infinite;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 90%);
    }
    @keyframes gridDrift { 0% { background-position: 0 0, 0 0; } 100% { background-position: 42px 42px, 42px 42px; } }
    .bg-vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, rgba(5,5,8,0) 45%, rgba(5,5,8,0.85) 100%); }

    /* CRT Effects */
    .crt::before {
      content: " "; display: block; position: fixed; inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 100; background-size: 100% 3px, 6px 100%; pointer-events: none;
    }
    .crt-flicker::after {
      content: " "; display: block; position: fixed; inset: 0; z-index: 101; pointer-events: none;
      background: rgba(255,255,255,0.02); animation: flicker 6.5s infinite;
    }
    @keyframes flicker { 0%, 96%, 100% { opacity: 0; } 97% { opacity: 1; } 98% { opacity: 0; } 99% { opacity: 0.6; } }
    .scanline { width: 100%; height: 15px; background: rgba(0, 210, 255, 0.05); position: fixed; top: 0; left: 0; z-index: 105; pointer-events: none; animation: scanline 8s linear infinite; }
    @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }

    /* Main UI Wrapper */
    #wrapper {
      width: 700px; max-width: 95vw; background: #080812; border: 4px solid #1a1a3a;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.2), inset 0 0 15px rgba(255, 0, 85, 0.1);
      border-radius: 8px; padding: 30px; position: relative; z-index: 10;
      display: flex; flex-direction: column;
    }

    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00d2ff; padding-bottom: 15px; margin-bottom: 30px; }
    .nav-btn { color: #00d2ff; text-decoration: none; font-size: 0.7rem; border: 1px solid #00d2ff; padding: 8px 12px; border-radius: 3px; transition: 0.2s; background: #111122; cursor: pointer; display: inline-block; }
    .nav-btn:hover { background: #00d2ff; color: #050508; }
    .module-title { color: #ff0055; font-size: 1.2rem; text-shadow: 2px 2px 0 #00d2ff; letter-spacing: 2px; }

    /* Game Interface */
    #game-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 350px; position: relative; }
    
    .status-bar { width: 100%; display: flex; justify-content: space-between; color: #8888aa; font-size: 0.8rem; margin-bottom: 20px; }
    #score-display { color: #00ff88; text-shadow: 0 0 5px rgba(0,255,136,0.5); }
    
    #timer-wrap { width: 100%; height: 10px; background: #111122; border: 1px solid #1a1a3a; margin-bottom: 40px; position: relative; }
    #timer-bar { height: 100%; width: 100%; background: #00d2ff; box-shadow: 0 0 10px #00d2ff; transition: width 0.1s linear, background-color 0.3s; }
    #timer-bar.warning { background: #ff0055; box-shadow: 0 0 10px #ff0055; }

    #equation-box { font-size: 2.5rem; color: #ffffff; text-shadow: 3px 3px 0px #ff0055, -2px -2px 0px #00d2ff; letter-spacing: 5px; margin-bottom: 30px; text-align: center; height: 60px; }
    
    .input-line { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; color: #00d2ff; }
    #answer-input { 
      background: transparent; border: none; border-bottom: 3px solid #00d2ff; color: #00ff88; 
      font-size: 1.5rem; width: 150px; text-align: center; outline: none; font-family: inherit;
      text-shadow: 0 0 8px rgba(0,255,136,0.6);
    }
    #answer-input:focus { border-bottom-color: #00ff88; }
    
    #message-overlay { 
      position: absolute; inset: 0; background: rgba(8,8,18,0.9); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20; text-align: center;
    }
    #msg-title { font-size: 1.5rem; color: #ff0055; margin-bottom: 20px; text-shadow: 0 0 10px #ff0055; }
    #msg-sub { font-size: 0.8rem; color: #8888aa; margin-bottom: 30px; line-height: 1.6; }

    .flash-green { animation: screenFlashGreen 0.3s ease-out; }
    .flash-red { animation: screenFlashRed 0.3s ease-out; }
    
    @keyframes screenFlashGreen { 0% { box-shadow: inset 0 0 50px #00ff88; background: rgba(0,255,136,0.1); } 100% { box-shadow: none; background: #080812; } }
    @keyframes screenFlashRed { 0% { box-shadow: inset 0 0 50px #ff0055; background: rgba(255,0,85,0.1); } 100% { box-shadow: none; background: #080812; } }

  </style>
</head>
<body class="crt crt-flicker">
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="scanline"></div>

  <div id="wrapper">
    <header>
      <a href="index.html" class="nav-btn">&lt; SYS.DIR</a>
      <div class="module-title">DECRYPT</div>
    </header>

    <div id="game-container">
      
      <div class="status-bar">
        <div>NODES DECRYPTED: <span id="score-display">0</span></div>
        <div>UPLINK TIME</div>
      </div>
      
      <div id="timer-wrap"><div id="timer-bar"></div></div>
      
      <div id="equation-box">INIT...</div>
      
      <div class="input-line">
        <span>&gt;</span>
        <input type="number" id="answer-input" autocomplete="off" disabled>
      </div>

      <div id="message-overlay">
        <div id="msg-title">SYSTEM LOCKED</div>
        <div id="msg-sub">Arithmetic decryption required.<br>Bypass firewall before trace completes.</div>
        <button class="nav-btn" id="start-btn" style="font-size: 1rem; padding: 15px 20px;">[ INITIATE HACK ]</button>
      </div>

    </div>
  </div>

  <script>
    /* --- AUDIO SYSTEM (Ported from master terminal) --- */
    const AudioSys = {
      ctx: null, master: null,
      init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      },
      resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
      blip(freq, dur, type, vol) {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(); o.type = type || 'square';
        const g = this.ctx.createGain(); g.gain.value = vol || 0.2;
        o.frequency.value = freq;
        o.connect(g); g.connect(this.master);
        const t = this.ctx.currentTime;
        g.gain.setValueAtTime(g.gain.value, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.start(t); o.stop(t + dur + 0.02);
      },
      click() { this.blip(1200, 0.06, 'square', 0.14); },
      success() { 
        this.blip(800, 0.1, 'square', 0.1); 
        setTimeout(() => this.blip(1200, 0.15, 'square', 0.15), 80); 
      },
      error() { 
        this.blip(200, 0.2, 'sawtooth', 0.2); 
        setTimeout(() => this.blip(150, 0.3, 'sawtooth', 0.25), 100); 
      },
      startTone() {
        [400, 600, 800].forEach((f, i) => setTimeout(() => this.blip(f, 0.1, 'square', 0.1), i * 100));
      }
    };

    /* --- GAME LOGIC --- */
    const UI = {
      wrapper: document.getElementById('wrapper'),
      equation: document.getElementById('equation-box'),
      input: document.getElementById('answer-input'),
      timerBar: document.getElementById('timer-bar'),
      scoreDisplay: document.getElementById('score-display'),
      overlay: document.getElementById('message-overlay'),
      startBtn: document.getElementById('start-btn'),
      msgTitle: document.getElementById('msg-title'),
      msgSub: document.getElementById('msg-sub')
    };

    let score = 0;
    let currentAnswer = 0;
    let maxTime = 10000; // ms
    let timeLeft = maxTime;
    let lastTick = 0;
    let gameLoop;
    let isPlaying = false;

    function generateEquation() {
      // Difficulty scales with score
      const difficulty = Math.min(score, 50); 
      
      let maxNum = 10 + Math.floor(difficulty * 1.5);
      let ops = ['+'];
      if (score > 4) ops.push('-');
      if (score > 12) ops.push('*');
      
      const op = ops[Math.floor(Math.random() * ops.length)];
      let num1, num2;

      if (op === '*') {
        maxNum = 3 + Math.floor(difficulty * 0.3);
        num1 = Math.floor(Math.random() * maxNum) + 2;
        num2 = Math.floor(Math.random() * maxNum) + 2;
        currentAnswer = num1 * num2;
      } else if (op === '-') {
        num1 = Math.floor(Math.random() * maxNum) + 1;
        num2 = Math.floor(Math.random() * maxNum) + 1;
        // Keep it positive for simplicity
        if (num2 > num1) [num1, num2] = [num2, num1];
        currentAnswer = num1 - num2;
      } else {
        num1 = Math.floor(Math.random() * maxNum) + 1;
        num2 = Math.floor(Math.random() * maxNum) + 1;
        currentAnswer = num1 + num2;
      }

      UI.equation.textContent = `${num1} ${op} ${num2} = ?`;
      UI.input.value = '';
    }

    function startGame() {
      AudioSys.init(); AudioSys.resume(); AudioSys.startTone();
      score = 0;
      maxTime = 10000;
      timeLeft = maxTime;
      isPlaying = true;
      
      UI.scoreDisplay.textContent = score;
      UI.overlay.style.display = 'none';
      UI.input.disabled = false;
      UI.input.focus();
      
      generateEquation();
      lastTick = performance.now();
      gameLoop = requestAnimationFrame(updateTimer);
    }

    function gameOver() {
      isPlaying = false;
      cancelAnimationFrame(gameLoop);
      AudioSys.error();
      
      UI.wrapper.classList.remove('flash-red', 'flash-green');
      void UI.wrapper.offsetWidth; // trigger reflow
      UI.wrapper.classList.add('flash-red');

      UI.input.disabled = true;
      UI.msgTitle.textContent = "TRACE COMPLETED";
      UI.msgTitle.style.color = "#ff0055";
      UI.msgSub.innerHTML = `Firewall breach failed.<br>Final Nodes Decrypted: <span style="color:#00ff88">${score}</span>`;
      UI.startBtn.textContent = "[ RETRY HACK ]";
      UI.overlay.style.display = 'flex';
    }

    function updateTimer(timestamp) {
      if (!isPlaying) return;
      
      const delta = timestamp - lastTick;
      lastTick = timestamp;
      
      // Time drains faster as score gets higher
      const drainMultiplier = 1 + (score * 0.04);
      timeLeft -= (delta * drainMultiplier);

      if (timeLeft <= 0) {
        timeLeft = 0;
        gameOver();
      } else {
        const pct = (timeLeft / maxTime) * 100;
        UI.timerBar.style.width = pct + '%';
        
        if (pct < 25) UI.timerBar.classList.add('warning');
        else UI.timerBar.classList.remove('warning');
        
        gameLoop = requestAnimationFrame(updateTimer);
      }
    }

    // Input Handling
    UI.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && isPlaying) {
        const val = parseInt(UI.input.value, 10);
        
        if (val === currentAnswer) {
          // Success
          AudioSys.success();
          score++;
          UI.scoreDisplay.textContent = score;
          
          // Flash effect
          UI.wrapper.classList.remove('flash-red', 'flash-green');
          void UI.wrapper.offsetWidth;
          UI.wrapper.classList.add('flash-green');

          // Add time back, but cap at maxTime
          timeLeft = Math.min(maxTime, timeLeft + 2500);
          
          generateEquation();
        } else {
          // Wrong Answer
          AudioSys.error();
          UI.wrapper.classList.remove('flash-red', 'flash-green');
          void UI.wrapper.offsetWidth;
          UI.wrapper.classList.add('flash-red');
          
          // Penalty
          timeLeft -= 2000; 
          UI.input.value = '';
        }
      }
    });

    // Start Buttons and auto-focus
    UI.startBtn.addEventListener('click', startGame);
    
    // Clicking anywhere on the game container focuses the input
    document.getElementById('game-container').addEventListener('click', () => {
      if (isPlaying) UI.input.focus();
    });

  </script>
</body>
</html>
