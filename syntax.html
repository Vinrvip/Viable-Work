<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syntax Shield - Viable Works</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #050508; color: #fff; }

    /* CRT & Background Effects */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    .crt::before {
      content: " "; display: block; position: fixed; inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
      z-index: 100; background-size: 100% 3px, 6px 100%; pointer-events: none;
    }
    .scanline {
      width: 100%; height: 12px; background: rgba(0, 210, 255, 0.04);
      position: fixed; top: 0; left: 0; z-index: 101; pointer-events: none;
      animation: scanline 8s linear infinite;
    }
    @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }

    /* Game Layout Container */
    #container {
      position: relative; z-index: 10; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 20px;
    }

    header {
      width: 100%; max-width: 700px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #00d2ff; padding-bottom: 12px;
    }
    .title { color: #ff0055; font-size: 1.1rem; text-shadow: 2px 2px 0 #00d2ff; letter-spacing: 1px; }
    .back-btn {
      color: #00d2ff; text-decoration: none; font-size: 0.65rem; border: 1px solid #00d2ff;
      padding: 6px 10px; border-radius: 3px; background: #111122; transition: 0.2s;
    }
    .back-btn:hover { background: #00d2ff; color: #050508; }

    /* Stats Panel */
    #stats {
      width: 100%; max-width: 700px; display: flex; justify-content: space-between;
      font-size: 0.7rem; color: #8888aa; margin-top: 10px;
    }
    .stat-val { color: #00ff88; margin-left: 6px; }

    /* Main Play Area */
    #game-box {
      position: relative; width: 100%; max-width: 480px; height: 65vh;
      background: #080814; border: 3px solid #1a1a3a; border-radius: 6px;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.15); overflow: hidden;
      display: flex; justify-content: space-around;
    }

    /* Lanes */
    .lane {
      position: relative; width: 23%; height: 100%;
      border-right: 1px dashed rgba(0, 210, 255, 0.15);
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    }
    .lane:last-child { border-right: none; }

    /* Target Shield Zone */
    #target-zone {
      position: absolute; bottom: 60px; left: 0; width: 100%; height: 50px;
      border-top: 2px solid #00d2ff; border-bottom: 2px solid #00d2ff;
      background: rgba(0, 210, 255, 0.08); pointer-events: none; z-index: 5;
      display: flex; justify-content: space-around; align-items: center;
    }

    .key-indicator {
      font-size: 1.2rem; color: rgba(0, 210, 255, 0.5); font-weight: bold;
      transition: transform 0.1s, color 0.1s;
    }
    .key-indicator.active { color: #00ff88; transform: scale(1.3); text-shadow: 0 0 8px #00ff88; }

    /* Falling Arrow Elements */
    .arrow-node {
      position: absolute; width: 44px; height: 44px; border-radius: 6px;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.2rem; font-weight: bold; z-index: 10;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    /* Lane Color Schemes */
    .lane-0 .arrow-node { background: #112233; border: 2px solid #00d2ff; color: #00d2ff; text-shadow: 0 0 5px #00d2ff; }
    .lane-1 .arrow-node { background: #113322; border: 2px solid #00ff88; color: #00ff88; text-shadow: 0 0 5px #00ff88; }
    .lane-2 .arrow-node { background: #333311; border: 2px solid #ffcc00; color: #ffcc00; text-shadow: 0 0 5px #ffcc00; }
    .lane-3 .arrow-node { background: #331122; border: 2px solid #ff0055; color: #ff0055; text-shadow: 0 0 5px #ff0055; }

    /* On-Screen Touch Controls (Mobile / Click Support) */
    #touch-controls {
      display: flex; gap: 12px; width: 100%; max-width: 480px; margin-top: 10px;
    }
    .btn-arrow {
      flex: 1; padding: 14px 0; background: #111122; border: 2px solid #00d2ff;
      color: #00d2ff; font-size: 1rem; border-radius: 6px; cursor: pointer; text-align: center;
      transition: 0.1s;
    }
    .btn-arrow:active { background: #00d2ff; color: #050508; }

    /* Overlay Screen (Start / Game Over) */
    #overlay {
      position: absolute; inset: 0; background: rgba(5, 5, 8, 0.92); z-index: 50;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 20px;
    }
    #overlay h2 { color: #ff0055; font-size: 1.2rem; margin-bottom: 15px; text-shadow: 2px 2px 0 #00d2ff; }
    #overlay p { color: #8888aa; font-size: 0.65rem; line-height: 1.8; margin-bottom: 20px; max-width: 320px; }
    .start-btn {
      background: #111122; border: 2px solid #00ff88; color: #00ff88;
      padding: 12px 20px; font-size: 0.75rem; border-radius: 4px; cursor: pointer;
      transition: 0.2s;
    }
    .start-btn:hover { background: #00ff88; color: #050508; box-shadow: 0 0 15px rgba(0,255,136,0.4); }

    footer { color: #444466; font-size: 0.55rem; letter-spacing: 1px; margin-top: 10px; }
  </style>
</head>
<body class="crt">
  <div class="bg-grid"></div>
  <div class="scanline"></div>

  <div id="container">
    <header>
      <div class="title">SYNTAX SHIELD</div>
      <a href="index.html" class="back-btn">&larr; SYS.DIRECTORY</a>
    </header>

    <div id="stats">
      <div>SCORE:<span id="score-val" class="stat-val">0</span></div>
      <div>COMBO:<span id="combo-val" class="stat-val">0x</span></div>
      <div>SHIELD:<span id="shield-val" class="stat-val">100%</span></div>
    </div>

    <div id="game-box">
      <div class="lane lane-0" id="lane-0"></div>
      <div class="lane lane-1" id="lane-1"></div>
      <div class="lane lane-2" id="lane-2"></div>
      <div class="lane lane-3" id="lane-3"></div>

      <div id="target-zone">
        <div class="key-indicator" id="ind-0">&larr;</div>
        <div class="key-indicator" id="ind-1">&uarr;</div>
        <div class="key-indicator" id="ind-2">&darr;</div>
        <div class="key-indicator" id="ind-3">&rarr;</div>
      </div>

      <div id="overlay">
        <h2 id="ovr-title">SYNTAX SHIELD</h2>
        <p id="ovr-desc">Interceptors active. Use the <strong>ARROW KEYS</strong> (&larr; &uarr; &darr; &rarr;) to block falling corruption data before it breaches the shield zone.</p>
        <button class="start-btn" id="start-btn">INITIALIZE SHIELD</button>
      </div>
    </div>

    <!-- Mobile / On-screen Controls -->
    <div id="touch-controls">
      <div class="btn-arrow" data-key="ArrowLeft">&larr;</div>
      <div class="btn-arrow" data-key="ArrowUp">&uarr;</div>
      <div class="btn-arrow" data-key="ArrowDown">&darr;</div>
      <div class="btn-arrow" data-key="ArrowRight">&rarr;</div>
    </div>

    <footer>VIABLE WORKS TERMINAL &middot; MODULE 13 &middot; ARROW PROTOCOL</footer>
  </div>

  <script>
    /* Web Audio System */
    const AudioSys = {
      ctx: null,
      init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      },
      blip(freq, dur, type = 'square', vol = 0.15) {
        if (!this.ctx) return;
        try {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = type; o.frequency.value = freq;
          g.gain.setValueAtTime(vol, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
          o.connect(g); g.connect(this.ctx.destination);
          o.start(); o.stop(this.ctx.currentTime + dur + 0.02);
        } catch (e) {}
      },
      hit() { this.blip(800, 0.06, 'square', 0.12); },
      perfect() { this.blip(1200, 0.08, 'triangle', 0.18); },
      miss() { this.blip(180, 0.2, 'sawtooth', 0.22); },
      over() { [300, 240, 180, 120].forEach((f, i) => setTimeout(() => this.blip(f, 0.2, 'sawtooth', 0.2), i * 120)); }
    };

    /* Game Constants & State */
    const LANES = [
      { key: 'ArrowLeft', symbol: '←', ind: document.getElementById('ind-0'), laneEl: document.getElementById('lane-0') },
      { key: 'ArrowUp', symbol: '↑', ind: document.getElementById('ind-1'), laneEl: document.getElementById('lane-1') },
      { key: 'ArrowDown', symbol: '↓', ind: document.getElementById('ind-2'), laneEl: document.getElementById('lane-2') },
      { key: 'ArrowRight', symbol: '→', ind: document.getElementById('ind-3'), laneEl: document.getElementById('lane-3') }
    ];

    let score = 0;
    let combo = 0;
    let shield = 100;
    let gameActive = false;
    let lastTime = 0;
    let spawnTimer = 0;
    
    // Starting difficulty parameters (Faster Start)
    let spawnInterval = 900; // ms between spawns (was 1400)
    let fallSpeed = 260; // px/sec speed (was 160)
    let nodes = [];

    const gameBox = document.getElementById('game-box');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const scoreVal = document.getElementById('score-val');
    const comboVal = document.getElementById('combo-val');
    const shieldVal = document.getElementById('shield-val');

    /* Target Zone Coordinates relative to game-box */
    const targetZoneY = () => gameBox.clientHeight - 110; // zone top
    const targetZoneHeight = 50;

    function startGame() {
      AudioSys.init();
      score = 0;
      combo = 0;
      shield = 100;
      
      // Reset difficulty to faster start
      spawnInterval = 900; 
      fallSpeed = 260; 
      
      // Clear existing nodes
      nodes.forEach(n => n.el.remove());
      nodes = [];

      updateStats();
      overlay.style.display = 'none';
      gameActive = true;
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      gameActive = false;
      AudioSys.over();
      document.getElementById('ovr-title').textContent = "SHIELD BREACHED";
      document.getElementById('ovr-desc').innerHTML = `Final Score: <strong>${score}</strong><br>Max Combo: <strong>${combo}x</strong>`;
      startBtn.textContent = "RESTART MODULE";
      overlay.style.display = 'flex';
    }

    function updateStats() {
      scoreVal.textContent = score;
      comboVal.textContent = combo + 'x';
      shieldVal.textContent = Math.max(0, Math.round(shield)) + '%';
      if (shield <= 30) shieldVal.style.color = '#ff0055';
      else shieldVal.style.color = '#00ff88';
    }

    function spawnNode() {
      const laneIdx = Math.floor(Math.random() * 4);
      const lane = LANES[laneIdx];
      const el = document.createElement('div');
      el.className = 'arrow-node';
      el.textContent = lane.symbol;

      lane.laneEl.appendChild(el);

      nodes.push({
        laneIdx,
        y: -50,
        speed: fallSpeed,
        el
      });
    }

    function gameLoop(now) {
      if (!gameActive) return;

      const dt = (now - lastTime) / 1000;
      lastTime = now;

      // Spawning
      spawnTimer += dt * 1000;
      if (spawnTimer >= spawnInterval) {
        spawnNode();
        spawnTimer = 0;
        
        // PROGRESSIVE DIFFICULTY SCALING
        // Smoothly decay the spawn interval by 1% each spawn, capping at 300ms
        if (spawnInterval > 300) {
          spawnInterval *= 0.99; 
        }
        // Smoothly increase fall speed, capping at a maximum speed so it remains playable
        if (fallSpeed < 700) {
          fallSpeed += 1.2;
        }
      }

      // Move Nodes
      const tY = targetZoneY();
      for (let i = nodes.length - 1; i >= 0; i--) {
        const n = nodes[i];
        n.y += n.speed * dt;
        n.el.style.top = n.y + 'px';

        // Check if node fell past target zone (Miss)
        if (n.y > tY + targetZoneHeight + 20) {
          n.el.remove();
          nodes.splice(i, 1);
          handleMiss();
        }
      }

      requestAnimationFrame(gameLoop);
    }

    function triggerKey(laneIdx) {
      if (!gameActive) return;

      // Animate Key Indicator
      const ind = LANES[laneIdx].ind;
      ind.classList.add('active');
      setTimeout(() => ind.classList.remove('active'), 120);

      // Find closest node in this lane inside target zone
      const tY = targetZoneY();
      let bestMatchIdx = -1;
      let minDiff = Infinity;

      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        if (n.laneIdx === laneIdx) {
          const diff = Math.abs(n.y - tY);
          if (diff < minDiff) {
            minDiff = diff;
            bestMatchIdx = i;
          }
        }
      }

      if (bestMatchIdx !== -1 && minDiff < 70) {
        // Hit!
        const node = nodes[bestMatchIdx];
        node.el.remove();
        nodes.splice(bestMatchIdx, 1);

        if (minDiff < 25) {
          // Perfect
          score += 150 + (combo * 10);
          combo++;
          AudioSys.perfect();
        } else {
          // Good
          score += 80 + (combo * 5);
          combo++;
          AudioSys.hit();
        }
        updateStats();
      } else {
        // Misclick penalty
        combo = 0;
        shield = Math.max(0, shield - 4);
        AudioSys.miss();
        updateStats();
        if (shield <= 0) gameOver();
      }
    }

    function handleMiss() {
      combo = 0;
      shield -= 12;
      AudioSys.miss();
      updateStats();
      if (shield <= 0) gameOver();
    }

    /* Input Listeners */
    window.addEventListener('keydown', (e) => {
      const idx = LANES.findIndex(l => l.key === e.code || l.key === e.key);
      if (idx !== -1) {
        e.preventDefault();
        triggerKey(idx);
      }
    });

    // Touch / Button Support
    document.querySelectorAll('.btn-arrow').forEach((btn) => {
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const key = btn.getAttribute('data-key');
        const idx = LANES.findIndex(l => l.key === key);
        if (idx !== -1) triggerKey(idx);
      });
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
