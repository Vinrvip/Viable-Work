<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viable Works - Module 01</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; user-select: none; }
    body { background-color: #050508; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .crt::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 100; pointer-events: none; }

    #game-wrapper { width: 500px; max-width: 95vw; background: #080812; border: 4px solid #1a1a3a; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); border-radius: 8px; padding: 20px; z-index: 10; display: flex; flex-direction: column; align-items: center; }
    .hud { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #00d2ff; padding-bottom: 10px; }
    .back-btn { background: transparent; color: #ff0055; border: 2px solid #ff0055; padding: 8px 12px; font-size: 0.7rem; cursor: pointer; text-decoration: none; }
    .back-btn:hover { background: #ff0055; color: #000; }
    .moves { color: #00d2ff; font-size: 0.8rem; }

    #game-area { position: relative; width: 100%; }
    #board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #111122; padding: 5px; border: 2px solid #333355; }
    .tile { background: #00d2ff; color: #050508; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; font-weight: bold; transition: transform 0.1s; }
    .tile.empty { background: transparent; cursor: default; }
    .tile:active:not(.empty) { transform: scale(0.95); }

    /* Overlay */
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; border: 2px solid #333355; }
    .action-btn { background: #111122; color: #00d2ff; border: 2px solid #00d2ff; padding: 15px 20px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
    .action-btn:hover { background: #00d2ff; color: #000; box-shadow: 0 0 15px #00d2ff; }
    #overlay-msg { color: #00d2ff; font-size: 0.8rem; margin-bottom: 20px; text-align: center; line-height: 1.5; display: none; }

    .instructions { margin-top: 15px; font-size: 0.65rem; color: #8888aa; text-align: center; line-height: 1.4; }
  </style>
</head>
<body class="crt">
  <div id="game-wrapper">
    <div class="hud">
      <a href="index.html" class="back-btn">◄ SYS.DIRECTORY</a>
      <div class="moves" id="move-counter">MOVES: 000</div>
    </div>

    <div id="game-area">
      <div id="board"></div>
      
      <div id="overlay">
        <div id="overlay-msg">SEQUENCE REPAIRED</div>
        <button class="action-btn" id="action-btn" onclick="startGame()">INITIATE SEQUENCE</button>
      </div>
    </div>

    <div class="instructions" id="status-text">MODULE 01: DATA SLIDE<br>Reconstruct sequence 1-15.</div>
  </div>

  <script>
    const board = document.getElementById('board');
    const moveCounter = document.getElementById('move-counter');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const actionBtn = document.getElementById('action-btn');
    
    let tiles = [];
    let moves = 0;
    let gameActive = false;

    function setupGame() {
      tiles = Array.from({length: 15}, (_, i) => i + 1);
      tiles.push(0);
      moves = 0;
      moveCounter.innerText = `MOVES: 000`;
      
      for (let i = 0; i < 100; i++) {
        const emptyIdx = tiles.indexOf(0);
        const validMoves = [];
        if (emptyIdx % 4 !== 0) validMoves.push(emptyIdx - 1); 
        if ((emptyIdx + 1) % 4 !== 0) validMoves.push(emptyIdx + 1);
        if (emptyIdx >= 4) validMoves.push(emptyIdx - 4);
        if (emptyIdx <= 11) validMoves.push(emptyIdx + 4);
        const moveIdx = validMoves[Math.floor(Math.random() * validMoves.length)];
        [tiles[emptyIdx], tiles[moveIdx]] = [tiles[moveIdx], tiles[emptyIdx]];
      }
      render();
    }

    function startGame() {
      overlay.style.display = 'none';
      setupGame();
      gameActive = true;
    }

    function moveTile(index) {
      if(!gameActive) return;
      const emptyIdx = tiles.indexOf(0);
      const isAdjacent = ((index === emptyIdx - 1 && emptyIdx % 4 !== 0) || (index === emptyIdx + 1 && (emptyIdx + 1) % 4 !== 0) || (index === emptyIdx - 4) || (index === emptyIdx + 4));

      if (isAdjacent) {
        [tiles[emptyIdx], tiles[index]] = [tiles[index], tiles[emptyIdx]];
        moves++;
        moveCounter.innerText = `MOVES: ${moves.toString().padStart(3, '0')}`;
        render();
        checkWin();
      }
    }

    function render() {
      board.innerHTML = '';
      tiles.forEach((num, index) => {
        const tileEl = document.createElement('div');
        tileEl.className = num === 0 ? 'tile empty' : 'tile';
        tileEl.innerText = num === 0 ? '' : num;
        tileEl.onclick = () => moveTile(index);
        board.appendChild(tileEl);
      });
    }

    function checkWin() {
      for (let i = 0; i < 15; i++) if (tiles[i] !== i + 1) return;
      gameActive = false;
      overlayMsg.style.display = 'block';
      actionBtn.innerText = "REBOOT MODULE";
      overlay.style.display = 'flex';
    }

    setupGame();
  </script>
</body>
</html>
