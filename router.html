<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIRCUIT ROUTER - Hard Mode (4x4 Grid)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; }
    body { background: #050508; color: #00d2ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
    #game-card { background: #080812; border: 3px solid #1a1a3a; padding: 20px; border-radius: 8px; width: 100%; max-width: 520px; box-shadow: 0 0 25px rgba(0, 210, 255, 0.2); }
    h1 { color: #ff0055; font-size: 1.1rem; margin-bottom: 12px; text-shadow: 2px 2px 0 #00d2ff; text-align: center; }
    .hud { display: flex; justify-content: space-between; font-size: 0.6rem; color: #8888aa; margin-bottom: 15px; }
    #grid { display: grid; grid-template-columns: repeat(4, 95px); gap: 10px; justify-content: center; background: #030306; padding: 12px; border: 2px solid #1a1a3a; border-radius: 6px; }
    .tile { width: 95px; height: 95px; background: #111122; border: 2px solid #1a1a3a; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s ease, border-color 0.2s, background-color 0.2s; user-select: none; }
    .tile:hover { border-color: #00d2ff; background: #181830; }
    .tile.powered { border-color: #00ff88; box-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
    .tile svg { width: 85px; height: 85px; pointer-events: none; }
    .controls-hint { margin-top: 15px; font-size: 0.55rem; color: #444466; text-align: center; }
    .back-btn { text-decoration: none; color: #8888aa; font-size: 0.6rem; display: block; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div id="game-card">
    <h1>CIRCUIT ROUTER [HARD]</h1>
    <div class="hud">
      <span>ROTATIONS: <span id="rot-count">0</span></span>
      <span>STATUS: <span id="status" style="color:#ff0055;">DISCONNECTED</span></span>
    </div>
    <div id="grid"></div>
    <div class="controls-hint">[CLICK TILE] ROTATE WIRE NODE (4x4 MATRIX)</div>
    <a href="index.html" class="back-btn">&lt; RETURN TO TERMINAL</a>
  </div>

  <script>
    // 0: UP, 1: RIGHT, 2: DOWN, 3: LEFT
    const BASE_PORTS = {
      'PWR':  [1],
      'CORE': [3],
      'I':    [1, 3],
      'L':    [1, 2],
      'T':    [1, 2, 3],
      'X':    [0, 1, 2, 3]
    };

    // 4x4 Grid layout with T-junctions, Crosses, and Bends
    const boardSetup = [
      { type: 'PWR',  rot: 0 }, { type: 'I', rot: 0 }, { type: 'T', rot: 0 }, { type: 'L', rot: 0 },
      { type: 'L',    rot: 0 }, { type: 'X', rot: 0 }, { type: 'I', rot: 0 }, { type: 'T', rot: 0 },
      { type: 'T',    rot: 0 }, { type: 'L', rot: 0 }, { type: 'X', rot: 0 }, { type: 'I', rot: 0 },
      { type: 'L',    rot: 0 }, { type: 'I', rot: 0 }, { type: 'T', rot: 0 }, { type: 'CORE', rot: 0 }
    ];

    let totalRotations = 0;

    function renderSVG(type) {
      if (type === 'PWR') {
        return `<svg viewBox="0 0 100 100">
          <line x1="50" y1="50" x2="100" y2="50" stroke="#00ff88" stroke-width="16" stroke-linecap="round"/>
          <circle cx="38" cy="50" r="28" fill="#003311" stroke="#00ff88" stroke-width="7"/>
          <text x="38" y="54" font-size="16" font-weight="bold" fill="#00ff88" text-anchor="middle" dominant-baseline="middle">PWR</text>
        </svg>`;
      }
      if (type === 'CORE') {
        return `<svg viewBox="0 0 100 100">
          <line x1="0" y1="50" x2="50" y2="50" stroke="#ff0055" stroke-width="16" stroke-linecap="round"/>
          <rect x="22" y="22" width="56" height="56" rx="8" fill="#330011" stroke="#ff0055" stroke-width="7"/>
          <text x="50" y="53" font-size="13" font-weight="bold" fill="#ff0055" text-anchor="middle" dominant-baseline="middle">CORE</text>
        </svg>`;
      }
      if (type === 'I') {
        return `<svg viewBox="0 0 100 100">
          <line x1="0" y1="50" x2="100" y2="50" stroke="#00d2ff" stroke-width="16" stroke-linecap="round"/>
        </svg>`;
      }
      if (type === 'L') {
        return `<svg viewBox="0 0 100 100">
          <path d="M 50 100 L 50 50 L 100 50" fill="none" stroke="#00d2ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
      }
      if (type === 'T') {
        return `<svg viewBox="0 0 100 100">
          <path d="M 0 50 L 100 50 M 50 50 L 50 100" fill="none" stroke="#00d2ff" stroke-width="16" stroke-linecap="round"/>
        </svg>`;
      }
      if (type === 'X') {
        return `<svg viewBox="0 0 100 100">
          <path d="M 0 50 L 100 50 M 50 0 L 50 100" fill="none" stroke="#00d2ff" stroke-width="16" stroke-linecap="round"/>
        </svg>`;
      }
      return '';
    }

    function scrambleBoard() {
      boardSetup.forEach(tile => {
        tile.rot = Math.floor(Math.random() * 4) * 90;
      });
    }

    function getActivePorts(tile) {
      const base = BASE_PORTS[tile.type];
      const shift = (tile.rot / 90) % 4;
      return base.map(p => (p + shift) % 4);
    }

    function createBoard() {
      const container = document.getElementById('grid');
      container.innerHTML = '';

      boardSetup.forEach((tile, idx) => {
        const div = document.createElement('div');
        div.className = 'tile';
        div.id = `tile-${idx}`;
        div.innerHTML = renderSVG(tile.type);
        div.style.transform = `rotate(${tile.rot}deg)`;

        div.addEventListener('click', () => {
          tile.rot = (tile.rot + 90) % 360;
          div.style.transform = `rotate(${tile.rot}deg)`;
          totalRotations++;
          document.getElementById('rot-count').textContent = totalRotations;
          checkCircuit();
        });

        container.appendChild(div);
      });
    }

    function checkCircuit() {
      // Dynamic BFS solver checking physical port connections from PWR (node 0) to CORE (node 15)
      const visited = new Array(16).fill(false);
      const queue = [0];
      visited[0] = true;

      // Reset powered styling
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('powered'));

      while (queue.length > 0) {
        const curr = queue.shift();
        document.getElementById(`tile-${curr}`).classList.add('powered');

        const currTile = boardSetup[curr];
        const currRow = Math.floor(curr / 4);
        const currCol = curr % 4;
        const currPorts = getActivePorts(currTile);

        // Check 4 adjacent directions: 0: UP, 1: RIGHT, 2: DOWN, 3: LEFT
        const neighbors = [
          { dir: 0, row: currRow - 1, col: currCol, opp: 2 },
          { dir: 1, row: currRow, col: currCol + 1, opp: 3 },
          { dir: 2, row: currRow + 1, col: currCol, opp: 0 },
          { dir: 3, row: currRow, col: currCol - 1, opp: 1 }
        ];

        neighbors.forEach(n => {
          if (n.row >= 0 && n.row < 4 && n.col >= 0 && n.col < 4) {
            const nextIdx = n.row * 4 + n.col;
            if (!visited[nextIdx] && currPorts.includes(n.dir)) {
              const nextTile = boardSetup[nextIdx];
              const nextPorts = getActivePorts(nextTile);

              // Valid connection requires matching opposite port on neighbor
              if (nextPorts.includes(n.opp)) {
                visited[nextIdx] = true;
                queue.push(nextIdx);
              }
            }
          }
        });
      }

      const status = document.getElementById('status');
      if (visited[15]) {
        status.textContent = 'POWER ONLINE';
        status.style.color = '#00ff88';
      } else {
        status.textContent = 'DISCONNECTED';
        status.style.color = '#ff0055';
      }
    }

    scrambleBoard();
    createBoard();
    checkCircuit();
  </script>
</body>
</html>
