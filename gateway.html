<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Viable Works - LOGIC GATEWAY</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; user-select: none; }
    body { background-color: #050508; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .crt::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); pointer-events: none; z-index: 100; }
    #game-wrapper { width: 450px; background: #080812; border: 4px solid #1a1a3a; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; align-items: center; z-index: 10; }
    .hud { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #00d2ff; padding-bottom: 10px; }
    .back-btn { background: transparent; color: #ff0055; border: 2px solid #ff0055; padding: 8px 12px; font-size: 0.7rem; cursor: pointer; text-decoration: none; transition: 0.2s; }
    .back-btn:hover { background: #ff0055; color: #000; box-shadow: 0 0 10px #ff0055; }
    .score-board { text-align: right; }
    #score { color:#00d2ff; font-size:0.8rem; margin-bottom: 5px; }
    #high-score { color:#8888aa; font-size:0.6rem; }
    #game-area { position: relative; }
    canvas { border: 2px solid #333355; background: #050508; display: block; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; border: 2px solid #333355; }
    .action-btn { background: #111122; color: #00d2ff; border: 2px solid #00d2ff; padding: 15px 20px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
    .action-btn:hover { background: #00d2ff; color: #000; box-shadow: 0 0 15px #00d2ff; }
    #overlay-msg { color: #ff0055; font-size: 0.8rem; margin-bottom: 20px; display: none; text-align:center; line-height: 1.5; }
  </style>
</head>
<body class="crt">
  <div id="game-wrapper">
    <div class="hud">
      <a href="index.html" class="back-btn">◄ SYS.DIR</a>
      <div class="score-board">
        <div id="score">PACKETS: 000</div>
        <div id="high-score">NODE: GATEWAY</div>
      </div>
    </div>
    <div id="game-area">
      <canvas id="canvas" width="400" height="400"></canvas>
      <div id="overlay">
        <div id="overlay-msg">POLARITY MISMATCH</div>
        <button class="action-btn" onclick="startGame()">OPEN GATEWAY</button>
      </div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    
    let packets = [];
    let score = 0;
    let gameActive = false;
    let animationId;
    let frameCount = 0;
    let receiverState = 0; // 0 or 1

    window.addEventListener('click', function() { window.focus(); });
    document.addEventListener('keydown', (e) => {
      if(gameActive && e.code === 'Space') {
        receiverState = receiverState === 0 ? 1 : 0;
        e.preventDefault();
      }
    });

    function startGame() {
      overlay.style.display = 'none';
      packets = [];
      score = 0;
      frameCount = 0;
      receiverState = 0;
      gameActive = true;
      document.getElementById('score').innerText = "PACKETS: 000";
      if(animationId) cancelAnimationFrame(animationId);
      update();
    }

    function update() {
      if(!gameActive) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frameCount++;
      
      let speed = 2 + (score / 15);
      let spawnRate = Math.max(60 - Math.floor(score), 20);

      if(frameCount % spawnRate === 0) {
        packets.push({
          y: -20,
          value: Math.random() > 0.5 ? 1 : 0
        });
      }

      // Draw Receiver
      ctx.fillStyle = receiverState === 1 ? '#00ffaa' : '#00d2ff';
      ctx.fillRect(150, 350, 100, 40);
      ctx.fillStyle = '#000';
      ctx.font = '20px "Press Start 2P"';
      ctx.fillText("[" + receiverState + "]", 165, 380);

      for(let i = 0; i < packets.length; i++) {
        let p = packets[i];
        p.y += speed;
        
        ctx.fillStyle = p.value === 1 ? '#00ffaa' : '#00d2ff';
        ctx.font = '24px "Press Start 2P"';
        ctx.fillText(p.value, 188, p.y);

        if(p.y > 350 && p.y < 390) {
          if(p.value === receiverState) {
            packets.splice(i, 1);
            score++;
            document.getElementById('score').innerText = "PACKETS: " + (score < 10 ? "00"+score : (score < 100 ? "0"+score : score));
          } else {
            triggerGameOver();
            return;
          }
        } else if(p.y > 400) {
            packets.splice(i, 1);
        }
      }
      if(gameActive) animationId = requestAnimationFrame(update);
    }

    function triggerGameOver() {
      gameActive = false;
      document.getElementById('overlay-msg').style.display = 'block';
      document.querySelector('.action-btn').innerText = "RECALIBRATE";
      overlay.style.display = 'flex';
    }
  </script>
</body>
</html>
