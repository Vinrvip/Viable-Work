<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viable Works - Module 05</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; user-select: none; }
    body { background-color: #050508; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .crt::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 100; pointer-events: none; }
    
    #game-wrapper { width: 450px; background: #080812; border: 4px solid #1a1a3a; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); border-radius: 8px; padding: 20px; z-index: 10; display: flex; flex-direction: column; align-items: center; }
    .hud { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #00d2ff; padding-bottom: 10px; }
    .back-btn { background: transparent; color: #ff0055; border: 2px solid #ff0055; padding: 8px 12px; font-size: 0.7rem; cursor: pointer; text-decoration: none; }
    .score { color: #00d2ff; font-size: 0.8rem; }
    
    #game-area { position: relative; width: 400px; height: 400px; }
    #board { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; height: 100%; padding: 15px; background: #050508; border: 2px solid #333355; }
    .pad { background: #111122; border: 4px solid #222244; border-radius: 4px; cursor: pointer; opacity: 0.5; transition: opacity 0.1s, transform 0.1s; }
    .pad.active { opacity: 1; transform: scale(0.95); box-shadow: 0 0 20px currentColor; }
    
    #pad-0 { color: #ff0055; border-color: #ff0055; }
    #pad-1 { color: #00d2ff; border-color: #00d2ff; }
    #pad-2 { color: #ffff00; border-color: #ffff00; }
    #pad-3 { color: #00ff66; border-color: #00ff66; }

    /* Overlay */
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; border: 2px solid #333355; }
    .action-btn { background: #111122; color: #00d2ff; border: 2px solid #00d2ff; padding: 15px 20px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
    .action-btn:hover { background: #00d2ff; color: #000; box-shadow: 0 0 15px #00d2ff; }
    #overlay-msg { color: #ff0055; font-size: 0.8rem; margin-bottom: 20px; text-align: center; line-height: 1.5; display: none; }
    
    .instructions { margin-top: 15px; font-size: 0.65rem; color: #8888aa; text-align: center; line-height: 1.4; }
  </style>
</head>
<body class="crt">
  <div id="game-wrapper">
    <div class="hud">
      <a href="index.html" class="back-btn">◄ SYS.DIRECTORY</a>
      <div class="score" id="level-display">LEVEL: 00</div>
    </div>
    
    <div id="game-area">
      <div id="board">
        <div class="pad" id="pad-0" onclick="handleInput(0)"></div>
        <div class="pad" id="pad-1" onclick="handleInput(1)"></div>
        <div class="pad" id="pad-2" onclick="handleInput(2)"></div>
        <div class="pad" id="pad-3" onclick="handleInput(3)"></div>
      </div>
      
      <div id="overlay">
        <div id="overlay-msg">SEQUENCE FAILED</div>
        <button class="action-btn" id="action-btn" onclick="startGame()">INITIATE SEQUENCE</button>
      </div>
    </div>

    <div class="instructions" id="status">MODULE 05: SEQUENCE<br>Memorize the terminal pattern. Replicate perfectly.</div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const actionBtn = document.getElementById('action-btn');
    const statusText = document.getElementById('status');
    const levelDisplay = document.getElementById('level-display');

    let sequence = [];
    let playerStep = 0;
    let inputLocked = true;

    function startGame() {
      overlay.style.display = 'none';
      sequence = [];
      levelDisplay.innerText = `LEVEL: 00`;
      statusText.style.color = '#8888aa';
      setTimeout(nextLevel, 500);
    }

    function nextLevel() {
      inputLocked = true;
      playerStep = 0;
      sequence.push(Math.floor(Math.random() * 4));
      levelDisplay.innerText = `LEVEL: ${sequence.length.toString().padStart(2, '0')}`;
      statusText.innerText = "OBSERVE PATTERN...";
      
      let delay = 800;
      sequence.forEach((padIndex, i) => {
        setTimeout(() => flashPad(padIndex), delay + (i * 600));
      });
      setTimeout(() => { 
        inputLocked = false; 
        statusText.innerText = "AWAITING INPUT...";
      }, delay + (sequence.length * 600));
    }

    function flashPad(index) {
      const pad = document.getElementById(`pad-${index}`);
      pad.classList.add('active');
      setTimeout(() => pad.classList.remove('active'), 300);
    }

    function handleInput(index) {
      if(inputLocked) return;
      flashPad(index);
      
      if(index === sequence[playerStep]) {
        playerStep++;
        if(playerStep === sequence.length) {
          inputLocked = true;
          statusText.innerText = "SEQUENCE ACCEPTED. PREPARING NEXT...";
          setTimeout(nextLevel, 1000);
        }
      } else {
        inputLocked = true;
        overlayMsg.style.display = 'block';
        actionBtn.innerText = "REBOOT MODULE";
        overlay.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
