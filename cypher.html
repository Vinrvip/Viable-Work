<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYPHER - Codebreaker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; }
    body { background: #050508; color: #00d2ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
    #game-card { background: #080812; border: 3px solid #1a1a3a; padding: 20px; border-radius: 8px; width: 100%; max-width: 500px; box-shadow: 0 0 25px rgba(0, 210, 255, 0.2); }
    h1 { color: #ff0055; font-size: 1.2rem; margin-bottom: 15px; text-shadow: 2px 2px 0 #00d2ff; text-align: center; }
    .status-bar { display: flex; justify-content: space-between; font-size: 0.65rem; color: #8888aa; margin-bottom: 15px; border-bottom: 1px solid #1a1a3a; padding-bottom: 8px; }
    #attempts-log { height: 220px; overflow-y: auto; background: #030306; border: 1px solid #1a1a3a; padding: 10px; margin-bottom: 15px; font-size: 0.65rem; display: flex; flex-direction: column; gap: 8px; }
    .log-entry { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #111122; padding-bottom: 4px; }
    .digits-row { display: flex; gap: 6px; }
    .digit-badge { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: #111122; border: 1px solid #00d2ff; color: #fff; font-size: 0.6rem; }
    .feedback { font-size: 0.55rem; }
    .exact { color: #00ff88; }
    .exist { color: #ffcc00; }
    #picker { display: flex; justify-content: space-around; margin-bottom: 15px; }
    .slot { width: 45px; height: 45px; border: 2px dashed #00d2ff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #fff; background: #111122; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
    .btn { background: #111122; border: 2px solid #00d2ff; color: #00d2ff; padding: 10px; font-size: 0.75rem; cursor: pointer; border-radius: 4px; text-align: center; }
    .btn:hover { background: #00d2ff; color: #050508; }
    .btn-action { background: #221122; border-color: #ff0055; color: #ff0055; }
    .btn-action:hover { background: #ff0055; color: #fff; }
    .back-btn { text-decoration: none; color: #8888aa; font-size: 0.6rem; display: block; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="game-card">
    <h1>CYPHER DECODE</h1>
    <div class="status-bar">
      <span>ATTEMPTS: <span id="tries-left">8</span>/8</span>
      <span>STATUS: RUNNING</span>
    </div>

    <div id="attempts-log"></div>

    <div id="picker">
      <div class="slot" id="slot-0">?</div>
      <div class="slot" id="slot-1">?</div>
      <div class="slot" id="slot-2">?</div>
      <div class="slot" id="slot-3">?</div>
    </div>

    <div class="keypad">
      <button class="btn num-btn">1</button>
      <button class="btn num-btn">2</button>
      <button class="btn num-btn">3</button>
      <button class="btn num-btn">4</button>
      <button class="btn num-btn">5</button>
      <button class="btn num-btn">6</button>
      <button class="btn btn-action" id="clear-btn">CLR</button>
      <button class="btn num-btn">0</button>
      <button class="btn btn-action" id="submit-btn">SUB</button>
    </div>

    <a href="index.html" class="back-btn">&lt; RETURN TO TERMINAL</a>
  </div>

  <script>
    const secret = [];
    while (secret.length < 4) {
      const num = Math.floor(Math.random() * 6) + 1;
      if (!secret.includes(num)) secret.push(num);
    }

    let currentGuess = [];
    let attemptsLeft = 8;
    const logDiv = document.getElementById('attempts-log');

    function updateSlots() {
      for (let i = 0; i < 4; i++) {
        const slot = document.getElementById(`slot-${i}`);
        slot.textContent = currentGuess[i] !== undefined ? currentGuess[i] : '?';
        slot.style.borderColor = currentGuess[i] !== undefined ? '#ff0055' : '#00d2ff';
      }
    }

    document.querySelectorAll('.num-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.textContent);
        if (currentGuess.length < 4 && !currentGuess.includes(val)) {
          currentGuess.push(val);
          updateSlots();
        }
      });
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      currentGuess = [];
      updateSlots();
    });

    document.getElementById('submit-btn').addEventListener('click', () => {
      if (currentGuess.length !== 4) return;

      let exact = 0, exist = 0;
      currentGuess.forEach((num, idx) => {
        if (num === secret[idx]) exact++;
        else if (secret.includes(num)) exist++;
      });

      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `
        <div class="digits-row">
          ${currentGuess.map(n => `<span class="digit-badge">${n}</span>`).join('')}
        </div>
        <div class="feedback">
          <span class="exact">${exact} MATCH</span> | <span class="exist">${exist} SHIFT</span>
        </div>
      `;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;

      if (exact === 4) {
        alert('FIREWALL DECRYPTED. ACCESS GRANTED.');
        location.reload();
        return;
      }

      attemptsLeft--;
      document.getElementById('tries-left').textContent = attemptsLeft;
      currentGuess = [];
      updateSlots();

      if (attemptsLeft === 0) {
        alert(`ACCESS DENIED. CODE WAS: ${secret.join('')}`);
        location.reload();
      }
    });
  </script>
</body>
</html>
